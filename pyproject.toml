[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketpulse"
dynamic = ["version"]
description = "Real-time crypto market-data lakehouse (Kafka -> Iceberg -> dbt -> Trino)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan David Obando", email = "juandavidobandojr@gmail.com" }]
keywords = ["data-engineering", "lakehouse", "iceberg", "kafka", "dbt", "dagster"]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "orjson>=3.10",
    "tenacity>=8.3",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingestion = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "confluent-kafka>=2.4",
    "fastavro>=1.9",
    "prometheus-client>=0.20",
]
serving = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "trino[sqlalchemy]>=0.328",
]
orchestration = [
    "dagster>=1.7,<2",
    "dagster-webserver>=1.7,<2",
    "dagster-dbt>=0.23",
    "dbt-trino>=1.8",
    "pyiceberg[s3fs]>=0.6",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "freezegun>=1.5",
]

[project.scripts]
marketpulse = "marketpulse.ingestion.cli:app"

[project.urls]
Documentation = "https://github.com/juandavidobando/marketpulse/tree/main/docs"
Source = "https://github.com/juandavidobando/marketpulse"

[tool.hatch.version]
path = "src/marketpulse/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

# --------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["dbt/**/target", "dbt/**/dbt_packages"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "PTH",      # use pathlib
    "S",        # flake8-bandit: subprocess, urlopen, assert, hardcoded secrets
    "BLE",      # blind except
    "DTZ",      # naive datetimes -- the single most costly bug class here
    "PL",       # pylint: refactor, convention, warning
    "SLF",      # private-member access
    "PT",       # pytest style
    "RUF",
]
ignore = [
    "E501",    # line length is the formatter's job
    "B008",    # typer and fastapi put calls in argument defaults by design
    "PLR0913", # a settings object legitimately has many fields
    "PLR2004", # a threshold in a test reads better inline than as a constant
    "S101",    # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into privates to assert on internal state, and
# hard-coded "credentials" in a test are fixtures, not secrets.
"tests/**" = ["S101", "S105", "S106", "SLF001", "PLR0915"]
# These build SQL by interpolation because Trino cannot bind an identifier and
# because a Dagster partition key is not caller input. Table names come from a
# module-level allow-list and partition keys are parsed as ISO dates before use;
# both guarantees are visible at the call site.
"orchestration/marketpulse_dagster/assets/*.py" = ["S608"]
"src/marketpulse/streaming/**" = ["N806"]  # Spark idioms use PascalCase locals

[tool.ruff.lint.isort]
known-first-party = ["marketpulse"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# Typing
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/marketpulse"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "pyspark.*",
    "fastavro.*",
    "trino.*",
    "dagster.*",
    "pyiceberg.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "marketpulse.streaming.*"
disallow_untyped_defs = false  # PySpark stubs are incomplete

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "unit: fast, hermetic tests with no external dependencies",
    "integration: requires the docker-compose stack to be running",
]

[tool.coverage.run]
source = ["src/marketpulse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
