# ---------------------------------------------------------------------------
# Spark defaults for the MarketPulse streaming and batch jobs.
# Anything a job would otherwise repeat in code lives here instead, so a
# submit command stays readable and the configuration is reviewable in one
# place.
# ---------------------------------------------------------------------------

# --- Iceberg catalog -------------------------------------------------------
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                rest
spark.sql.catalog.lakehouse.uri                 http://iceberg-rest:8181
spark.sql.catalog.lakehouse.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint         http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.warehouse           s3://lakehouse/warehouse
spark.sql.defaultCatalog                        lakehouse

# --- s3a, for streaming checkpoints only ----------------------------------
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled      false

# --- Streaming -------------------------------------------------------------
# Iceberg commits are atomic per micro-batch, so a failed batch leaves no
# partial data. The retry budget is small on purpose: a batch that fails four
# times is failing for a reason retrying will not fix.
spark.sql.streaming.stateStore.providerClass    org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
spark.sql.streaming.metricsEnabled              true
spark.task.maxFailures                          4

# --- Sizing ----------------------------------------------------------------
# AQE is off for the streaming jobs: micro-batches are small and uniform, and
# adaptive re-planning adds latency without changing the plan. Batch jobs
# re-enable it explicitly.
spark.sql.adaptive.enabled                      false
spark.sql.shuffle.partitions                    8
spark.sql.files.maxPartitionBytes               134217728
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# --- Behaviour -------------------------------------------------------------
# Fail on an ambiguous timestamp rather than guessing. Market data is
# timestamp-critical and a silent LEGACY-mode rebase is a data-correctness bug
# that surfaces months later.
spark.sql.parquet.datetimeRebaseModeInWrite     EXCEPTION
spark.sql.parquet.int96RebaseModeInWrite        EXCEPTION
spark.sql.session.timeZone                      UTC
spark.ui.showConsoleProgress                    false
