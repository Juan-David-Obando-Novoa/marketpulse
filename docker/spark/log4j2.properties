# Spark at INFO logs a block report per micro-batch, which at a 60-second
# trigger buries every application log line. WARN for Spark, INFO for us.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n

logger.marketpulse.name = marketpulse
logger.marketpulse.level = info

logger.streaming.name = org.apache.spark.sql.execution.streaming
logger.streaming.level = warn

# Every Kafka client logs its full effective configuration at INFO on start-up.
logger.kafka.name = org.apache.kafka
logger.kafka.level = error
