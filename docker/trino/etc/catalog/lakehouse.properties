# Trino reads the same Iceberg tables Spark writes, through the same REST
# catalog. One catalog, two engines, one snapshot -- which is the entire
# argument for Iceberg in ADR-0002.
#
# THE FILENAME IS THE CATALOG NAME. Trino derives it from the file, not from
# anything inside: this must stay lakehouse.properties to match
# spark.sql.catalog.lakehouse and dbt's `catalog: lakehouse`. Naming it after
# the connector instead gives you a catalog called "iceberg" and every query
# fails with "Catalog 'lakehouse' not found".
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/warehouse

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin

# dbt creates tables; without this every model materialisation fails with a
# permission error that reads like a catalog problem.
iceberg.register-table-procedure.enabled=true

# Compression is a CATALOG setting in the Iceberg connector, not a table
# property. `write_compression` is the Hive connector's spelling and Trino
# rejects it outright ("table property 'write_compression' does not exist"),
# which is a confusing error to hit from a dbt model that looks correct.
# ZSTD is already the default; stating it keeps the intent in the repo rather
# than in a Trino release note.
iceberg.compression-codec=ZSTD

# Trino's default target file size produces a lot of small files when dbt
# writes incrementally; matching the Iceberg maintenance target keeps the two
# from fighting each other.
iceberg.target-max-file-size=128MB
