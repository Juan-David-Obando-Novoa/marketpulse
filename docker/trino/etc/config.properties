# Single-node coordinator: it is also a worker, which is fine for a local
# stack and explicitly wrong for anything else.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Sized for a laptop. query.max-memory is per query across the cluster;
# query.max-memory-per-node is the one that actually kills a runaway
# aggregation before it takes the JVM with it.
query.max-memory=2GB
query.max-memory-per-node=1GB
memory.heap-headroom-per-node=512MB

# dbt issues a lot of small metadata queries alongside the model runs.
task.concurrency=4
